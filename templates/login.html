{% extends "base.html" %}

{% block title %}
    Login | SentimentCare
{% endblock %}

{% block content %}
    <section class="auth-card">
        <h1>Login</h1>

        <!-- send entered data securely in request body, not send through URL. Submit form to Flask login() route -->
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="login_identifier">
                    Username or email
                </label>

                <input 
                    type="text"
                    id="login_identifier"
                    name="login_identifier"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input 
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>
        </form>

        <p class="auth-link">
            Do not have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>
    </section>
{% endblock %}
