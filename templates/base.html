<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>
            {% block title %}
                Emotional Awareness Application
            {% endblock %}
        </title>

        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='style.css') }}"
        >
    </head>

    <body>
        <header class="site-header">
            <nav class="navbar">
                <a class="logo" href="{{ url_for('home') }}">
                    SentimentCare
                </a>

                <div class="nav-links">
                    <a href="{{ url_for('home') }}">
                        Home
                    </a>

                    <a href="{{ url_for('analysis') }}">
                        Analyse Text
                    </a>
                </div>
            </nav>
        </header>

        <main class="page-content">
            {% block content %}
            {% endblock %}
        </main>
    </body>
</html>
