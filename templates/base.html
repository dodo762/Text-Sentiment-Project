<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>
            {% block title %}
                Emotional Awareness Application
            {% endblock %}
        </title>

        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='style.css') }}"
        >
    </head>

    <body>
        <header class="site-header">
            <nav class="navbar">
                <a class="logo" href="{{ url_for('home') }}">
                    SentimentCare
                </a>

                <div class="nav-links">
                    <a href="{{ url_for('home') }}">
                        Home
                    </a>

                    <a href="{{ url_for('analysis') }}">
                        Analyse Text
                    </a>
                    <a href="{{ url_for('login') }}">
                        Login
                    </a>
                    <a href="{{ url_for('register') }}">
                        Register
                    </a>
                </div>
            </nav>
        </header>
        <!--display flashed messages(to provide feedback after a request, such as successful registration/invalid input)-->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-container">
                    {% for category, message in messages %}
                        <div class="flash-message {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <main class="page-content">
            {% block content %}
            {% endblock %}
        </main>
    </body>
</html>
