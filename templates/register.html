{% extends "base.html" %}

{% block title %}
    Register | SentimentCare
{% endblock %}

{% block content %}
    <section class="auth-card">
        <h1>Create an account</h1>

        <p class="description">
            Register to save your sentiment history and reflections.
        </p>

        <form method="POST">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                maxlength="50"
                value="{{ request.form.get('username', '') }}"
                required
            >

            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                name="email"
                maxlength="100"
                value="{{ request.form.get('email', '') }}"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >
            
            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                required
            >

            <button type="submit">
                Create account
            </button>
        </form>

        <p class="auth-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </section>
{% endblock %}
